name: Bug Report
description: Create a report to help us improve
title: "<-- Title -->"
body:
- type: textarea
  attributes:
    label: "Context"
    description: "Please provide the following information:"
    value: |
      <!-- Describe the bug and provide relevant context -->

      ##### Current Behavior
      <!-- Describe what currently happens -->

      ##### Expected Behavior
      <!-- Describe what you expect to happen -->

      ##### References 
      <!-- Add links to relevant Slack or Zenhub conversations -->
      ---

      - [ ] This is an epic issue that will be broken down into smaller, manageable tasks
      - [ ] This bug fix requires testing in a staging environment before production deployment
  validations:
    required: true
- type: textarea
  attributes:
    label: "Steps To Reproduce"
    description: "How do you trigger this bug? Please walk us through it step by step."
    value: |
      Steps to reproduce the behavior - 
        1. In this environment...
        1. With this config...
        1. Run '...'
        1. See error...
    render: bash
  validations:
    required: false
- type: textarea
  attributes:
    label: "Environment"
    description: "Environment the bug was reproduced on."
    value: |
          - **OS**:
          - **Node**:
          - **npm**:
          - **Browser**:
    render: bash
  validations:
    required: false
