name: Feature Request
description: Suggest an idea for this project
title: "[FEATURE] "
body:
- type: textarea
  attributes:
    label: Context
    description: "A concise description of the feature request with any relevant additional references."
  validations:
    required: true
- type: textarea
  attributes:
    label: Slack References
    description: "Link to relevant Slack conversations, threads, or messages. You can add multiple references by separating them with new lines."
  validations:
    required: false
- type: textarea
  attributes:
    label: Problem Statement
    description: "A clear and concise description of what the problem is. Ex. I'm always frustrated when [...]"
  validations:
    required: true
- type: textarea
  attributes:
    label: Proposed Solution
    description: "A clear and concise description of what you want to happen."
  validations:
    required: true
- type: textarea
  attributes:
    label: Alternative Solutions
    description: "A clear and concise description of any alternative solutions or features you've considered."
  validations:
    required: false
- type: textarea
  attributes:
    label: Additional Context
    description: "Add any other context or screenshots about the feature request here."
  validations:
    required: false
- type: dropdown
  id: scope
  attributes:
    label: "Can the scope of the problem be broken down to smaller pieces?"
    description: "Please consider if this issue is a small issue that describes a single problem or flag this as an Epic so a series of issues could be referenced to it."
    multiple: false
    options:
    - This is a small issue
    - This is an Epic
  validations:
    required: true
